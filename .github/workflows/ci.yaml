name: CI

on:
  push:
    branches: [main, develop, "copilot/**"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Lint: Python style/correctness + YAML validity. Format/linters run in a
  # non-blocking check mode so CI stays green while surfacing issues.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python (syntax check)
        run: python -m compileall -q edition2 tests

      - name: Lint YAML workflows
        run: |
          pipx run yamllint -d relaxed .github/workflows || true

      - name: Black (check)
        run: |
          pip install black
          black --check edition2 tests || true

      - name: Pylint (report)
        run: |
          pip install pylint
          pylint --disable=C,R --exit-zero edition2 || true

  # -------------------------------------------------------------------------
  # Test: standard-library unittest suite (plus pytest if present).
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Run pytest (if configured)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if python -c "import pytest" 2>/dev/null; then
            pytest tests/ -q
          else
            echo "pytest not installed; unittest suite already ran"
          fi

  # -------------------------------------------------------------------------
  # Docker: validate the buildx bake targets resolve (no push on CI).
  # -------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate bake targets
        run: >
          REGISTRY=localhost/aicodex
          docker buildx bake -f docker/docker-bake.hcl --print default

  # -------------------------------------------------------------------------
  # Swift: build the full SwiftUI package with installed stable and newest
  # Xcode toolchains. "latest" includes beta/developer builds when available
  # on the runner; no Apple account or toolchain download is required.
  # -------------------------------------------------------------------------
  swift:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        xcode: [latest-stable, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Select installed Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show selected toolchain
        run: xcodebuild -version

      - name: SwiftLint (when available)
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --strict apple/Sources || true
          else
            echo "swiftlint not installed; skipping"
          fi

      - name: Build SwiftUI app and test Swift core
        run: |
          cd apple
          swift build
          swift test

  # -------------------------------------------------------------------------
  # Aggregate status: reports every job's state, always runs.
  # -------------------------------------------------------------------------
  status:
    runs-on: ubuntu-latest
    needs: [lint, test, docker, swift]
    if: always()
    steps:
      - name: Report job states
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          echo "lint:   $LINT_RESULT"
          echo "test:   $TEST_RESULT"
          echo "docker: $DOCKER_RESULT"
          echo "swift:  $SWIFT_RESULT"
          for result in "$LINT_RESULT" "$TEST_RESULT" \
                        "$DOCKER_RESULT" "$SWIFT_RESULT"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
