name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # keyless image signing (cosign)

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Build hardened multi-platform images and push them to the registry.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform images
        run: docker buildx bake -f docker/docker-bake.hcl --push default

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless)
        run: |
          for target in linux windows android; do
            cosign sign --yes "${REGISTRY}/aicodex-${target}:latest"
          done

  # Apple build: prepare credentials from secrets and archive the SwiftUI app.
  # Secrets are provided via the repository/environment — never committed.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import distribution certificate
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "${APPLE_DIST_CERT_P12}" ]; then
            echo "No Apple distribution certificate provided; skipping import"
            exit 0
          fi
          echo "$APPLE_DIST_CERT_P12" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "" build.keychain
          security import /tmp/dist.p12 -k build.keychain \
            -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f /tmp/dist.p12

      - name: Build SwiftUI package
        run: |
          cd apple
          swift build
